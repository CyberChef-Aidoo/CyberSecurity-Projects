<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>100 Days of Building Cybersecurity Projects</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <!-- subtle circuit-style accents -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M60 60 H180 V100 H260"/>
    <circle cx="260" cy="100" r="4" fill="#38bdf8"/>
    <path d="M1000 220 H900 V180 H840"/>
    <circle cx="840" cy="180" r="4" fill="#818cf8"/>
    <path d="M1140 60 H1040 V90"/>
    <circle cx="1040" cy="90" r="4" fill="#38bdf8"/>
  </g>

  <!-- lock / shield motif -->
  <g transform="translate(120,150)">
    <path d="M0 -55 L48 -35 V10 C48 45 24 65 0 75 C-24 65 -48 45 -48 10 V-35 Z"
          fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M0 13 V32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="230" y="140" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    100 Days of
  </text>
  <text x="230" y="195" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">
    Cybersecurity Projects
  </text>
  <text x="232" y="230" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#94a3b8">
    One hands-on security tool, built and documented every day
  </text>
</svg>
